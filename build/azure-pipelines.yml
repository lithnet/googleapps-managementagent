pool:
  vmImage: 'windows-latest'

resources:
  repositories:
  - repository: release_tools
    type: git
    name: release-tools/release-tools
    ref: refs/heads/master

variables:
  - name: buildPlatform
    value: 'Any CPU'
  - name: buildConfiguration
    value: 'Release'
  - name: build.version.major
    value: 2
  - name: build.version.minor
    value: 2
  - name: build.version.revision
    value: $[counter(format('{0}.{1}', variables['build.version.major'], variables['build.version.minor']), 0)]
  - name: build.version.suffix
    value:
  - name: build.version
    value: $(build.version.major).$(build.version.minor).$(build.version.revision)$(build.version.suffix)
  - name: build.versionShort
    value: $(build.version.major).$(build.version.minor).$(build.version.revision)
  - name: build.date
    value: $[format('{0:yyyy}-{0:MM}-{0:dd}T{0:HH}:{0:mm}:{0:ss}', pipeline.startTime)]
  - name: azure.subscription
    value: 'ProductionServices'
  - name: product.description
    value: 'Lithnet Google Workspace Management Agent for Microsoft Identity Manager'

name: $(build.version.major).$(build.version.minor).$(build.version.revision)$(build.version.suffix)
trigger: none

stages:
- stage: build_provider
  displayName: Build project
  dependsOn: []
  jobs:
    - job: "build_provider_job"
      displayName: Build project
      steps:
      - template: templates/checkout.yaml@release_tools

      - task: NuGetAuthenticate@1
      - task: NuGetCommand@2
        displayName: 'Restore NuGet packages'
        inputs:
          command: 'restore'
          restoreSolution: 'src/Lithnet.GoogleApps.MA.sln'
          feedsToUse: 'config'
          nugetConfigPath: 'src/nuget.config'

      - task: DotNetCoreCLI@2
        displayName: 'Build project'
        inputs:
          command: build
          arguments: '-c $(buildConfiguration) -p:Version=$(build.version) -p:GeneratePackageOnBuild=false --output "$(build.ArtifactStagingDirectory)"'
          projects: 'src/Lithnet.GoogleApps.MA/Lithnet.GoogleApps.MA.csproj'

      # The installer embeds the MA from the staging directory, so sign it before the MSI is built.
      - template: templates/codesign.yaml@release_tools
        parameters:
          path:
          - $(Build.ArtifactStagingDirectory)/Lithnet.GoogleApps.MA.dll
          environment: 'prod'
          azureSubscription: $(azure.subscription)
          description: $(product.description)

      - task: MSBuild@1
        displayName: 'Build installer'
        inputs:
          solution: '**/*.wixproj'
          msbuildArchitecture: 'x64'
          platform: 'x64'
          configuration: '$(buildConfiguration)'
          msbuildArguments: '/p:Version=$(build.version) /p:OutputPath=$(Build.ArtifactStagingDirectory) /p:BuildProjectReferences=false'

      - template: templates/codesign.yaml@release_tools
        parameters:
          path:
          - $(Build.ArtifactStagingDirectory)/Lithnet.GoogleApps.MA.Setup.msi
          environment: 'prod'
          azureSubscription: $(azure.subscription)
          description: $(product.description)

      - template: templates/verify-authenticode-signatures.yaml@release_tools
        parameters:
          path:
          - $(Build.ArtifactStagingDirectory)/Lithnet.GoogleApps.MA.dll
          - $(Build.ArtifactStagingDirectory)/Lithnet.GoogleApps.MA.Setup.msi

      - task: PublishPipelineArtifact@1
        displayName: Publish artifact
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/Lithnet.GoogleApps.MA.Setup.msi'
          publishLocation: 'pipeline'
          artifact: installer

- stage: publish_github
  displayName: Publish GitHub pre-release
  dependsOn: "build_provider"
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
      - deployment: 'PublishPackages'
        environment: 'GitHub'
        displayName: Publish signed MSI as a GitHub pre-release
        pool:
          vmImage: windows-2022
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: none
              - download: current
                artifact: installer
              - task: GitHubRelease@1
                displayName: Create GitHub pre-release v$(build.version)
                inputs:
                  gitHubConnection: github.com_lithnet
                  repositoryName: '$(Build.Repository.Name)'
                  action: 'create'
                  target: '$(Build.SourceVersion)'
                  tagSource: 'userSpecifiedTag'
                  tag: v$(build.version)
                  title: v$(build.version)
                  assets: '$(Pipeline.Workspace)/installer/*.msi'
                  isPreRelease: true
                  addChangeLog: true
                  changeLogCompareToRelease: 'lastFullRelease'
                  changeLogType: 'commitBased'

- stage: promote_github_release
  displayName: Promote GitHub release
  dependsOn: publish_github
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
      - deployment: 'PromoteRelease'
        environment: 'GitHub'
        displayName: Promote pre-release to full release
        pool:
          vmImage: windows-2022
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: none
              - download: none
              - task: PowerShell@2
                displayName: Verify GitHub pre-release v$(build.version)
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $releaseUri = "https://api.github.com/repos/$(Build.Repository.Name)/releases/tags/v$(build.version)"
                    $headers = @{
                      Accept = "application/vnd.github+json"
                      "User-Agent" = "Lithnet-Release-Pipeline"
                      "X-GitHub-Api-Version" = "2022-11-28"
                    }

                    try
                    {
                      $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get
                    }
                    catch
                    {
                      throw "GitHub pre-release v$(build.version) could not be retrieved. Promotion has stopped. $($_.Exception.Message)"
                    }

                    if ($release.draft)
                    {
                      throw "GitHub release v$(build.version) is a draft. Promotion has stopped."
                    }

                    if (-not $release.prerelease)
                    {
                      throw "GitHub release v$(build.version) is not a pre-release. Promotion has stopped."
                    }

                    if (-not [string]::Equals([string]$release.target_commitish, "$(Build.SourceVersion)", [System.StringComparison]::OrdinalIgnoreCase))
                    {
                      throw "GitHub pre-release v$(build.version) targets commit '$($release.target_commitish)', not '$(Build.SourceVersion)'. Promotion has stopped."
                    }

                    $msiAssets = @($release.assets | Where-Object { $_.name -like "*.msi" })
                    if ($msiAssets.Count -eq 0)
                    {
                      throw "GitHub pre-release v$(build.version) does not contain an MSI asset. Promotion has stopped."
                    }

                    Write-Host "Verified GitHub pre-release v$(build.version) at commit $(Build.SourceVersion) with $($msiAssets.Count) MSI asset(s)."
              - task: GitHubRelease@1
                displayName: Promote GitHub release v$(build.version)
                inputs:
                  gitHubConnection: github.com_lithnet
                  repositoryName: '$(Build.Repository.Name)'
                  action: edit
                  target: '$(Build.SourceVersion)'
                  tag: v$(build.version)
                  isDraft: false
                  isPreRelease: false
                  makeLatest: true
                  addChangeLog: false
                  assets: ''
                  assetUploadMode: replace
